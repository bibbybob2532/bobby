<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-main: #202124;
            --bg-sidebar: #171717;
            --bg-card: #303134;
            --bg-input: #3c4043;
            --text-primary: #e8eaed;
            --text-secondary: #9aa0a6;
            --border-color: #5f6368;
            --accent-primary: #a855f7;
            --accent-glow: rgba(168, 85, 247, 0.5);
            --font-family: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            overflow: hidden;
            height: 100vh;
        }

        /* --- Sidebar --- */
        .sidebar {
            width: 280px;
            height: 100vh;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 1rem;
            gap: 1.5rem;
            transition: width 0.3s ease, padding 0.3s ease;
            flex-shrink: 0;
        }

        .sidebar.collapsed {
            width: 80px;
            padding: 1rem 0.5rem;
        }

        .sidebar.collapsed .sidebar-content {
            opacity: 0;
            pointer-events: none;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sidebar-toggle {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            transition: color 0.2s ease, transform 0.3s ease;
        }
        .sidebar-toggle:hover {
            color: var(--text-primary);
        }
        .sidebar-toggle .logo {
            transition: opacity 0.3s ease; /* Only opacity transition needed now */
        }
        /* .logo-gemini-star transition is not strictly needed if removed, but keeping general SVG transitions is fine */

        /* CSS for .sidebar-clock is no longer needed and will be removed by deletion of the element */

        .sidebar.collapsed .sidebar-toggle .logo {
            display: inline-block; /* Show logo (analog clock) when sidebar is collapsed */
        }

        /* Ensure the button content is centered and SVG hands look correct */
        .sidebar-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px; /* Fixed width for centering content */
            height: 48px; /* Fixed height for centering content */
        }
        .sidebar.collapsed .logo-gemini-star {
            /* Optional: Hide gemini star if it clutters the clock, for now it's removed from SVG */
            /* display: none; */
        }

        .project-item { /* Used for items in both Projects and Pinned sections */
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .pin-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 0.25rem 0.4rem; /* Adjusted padding */
            font-size: 0.9rem;
            border-radius: 4px; /* Added for hover effect consistency */
        }
        .pin-btn:hover {
            color: var(--text-primary);
            background-color: var(--bg-input); /* Subtle background on hover */
        }
        .pin-btn.pinned .fa-thumbtack {
            color: var(--accent-primary);
        }

        .filter-btn {
            background-color: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .filter-btn:hover {
            background-color: var(--bg-input);
            color: var(--text-primary);
        }
        .filter-btn.active-filter {
            background-color: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }

        .search-filter-btn {
            background-color: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .search-filter-btn:hover {
            background-color: var(--bg-input);
            color: var(--text-primary);
        }
        .search-filter-btn.active-search-filter {
            background-color: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }

        .sidebar-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            overflow-y: auto;
            opacity: 1;
            transition: opacity 0.2s ease;
        }
        #pinned-projects-section { /* Ensure it consumes space like other sections */
            /* padding-bottom: 0; Remove extra padding if items have their own */
        }
        #pinned-projects-section .section-header {
            margin-bottom: 0.5rem; /* Space between header and items */
        }
        .pinned-items-container .component-list-item { /* Specific to pinned items if needed */
            margin-bottom: 0.5rem; /* Spacing between pinned items */
        }
        .pinned-items-container .component-list-item:last-child {
            margin-bottom: 0;
        }
        .sidebar-content::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar-content::-webkit-scrollbar-thumb {
            background: var(--bg-input);
            border-radius: 4px;
        }

        .search-bar {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background-color: var(--bg-input);
            padding: 0.5rem 0.75rem;
            border-radius: 20px;
        }
        .search-bar i {
            color: var(--text-secondary);
        }
        .search-bar input {
            width: 100%;
            background: none;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .components-section {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 0.25rem;
        }
        .section-header span {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
        }
        .view-more {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.8rem;
            cursor: pointer;
        }
        .view-more:hover {
            text-decoration: underline;
        }

        .component-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
        }
        .component-item {
            height: 60px;
            background-color: var(--bg-card);
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        .component-item::after {
            content: attr(data-name);
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 8px;
            background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
            color: white;
            font-size: 0.8rem;
            text-align: center;
            opacity: 0;
            transform: translateY(100%);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .component-item:hover {
            background-color: var(--bg-input);
        }
        .component-item:hover::after {
            opacity: 1;
            transform: translateY(0);
        }
        .component-list-item {
            background-color: var(--bg-card);
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.9rem;
            text-align: center;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .component-list-item:hover {
            background-color: var(--bg-input);
        }

        .sidebar-footer {
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
        }
        .sidebar.collapsed .sidebar-footer {
            border-top: none;
        }

        /* --- Main Content --- */
        .main-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative; /* For positioning the bottom bar */
        }

        .main-header {
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: flex-end;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .main-content {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card-container {
            display: flex;
            gap: 2rem;
        }

        /* --- Interactive Feature Cards --- */
        .feature-card {
            width: 320px;
            height: 400px;
            background-color: var(--bg-card);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            border: 1px solid var(--border-color);
            transition: transform 0.1s ease-out;
            animation: pulse 15s infinite ease-in-out;
        }
        .feature-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border-radius: 20px;
            background: radial-gradient(
                400px circle at var(--mouse-x) var(--mouse-y),
                var(--accent-glow),
                transparent 40%
            );
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 1;
        }
        .feature-card:hover::before {
            opacity: 1;
        }

        @keyframes pulse {
            0%, 95%, 100% { box-shadow: 0 0 0 0 rgba(168, 85, 247, 0); }
            97% { box-shadow: 0 0 20px 5px var(--accent-glow); }
        }

        .card-preview {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-secondary);
        }
        .card-action-button {
            width: 100%;
            padding: 1.25rem;
            background-color: var(--bg-input);
            border: none;
            border-top: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .card-action-button:hover {
            background-color: #4a4e52;
        }


        /* --- Bottom Interaction Bar --- */
        .bottom-bar-wrapper {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            z-index: 10;
        }

        .main-input-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background-color: var(--bg-input);
            padding: 0.5rem 0.75rem;
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
        }
        .main-input {
            width: 400px;
            background: none;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 1rem;
            padding: 0.5rem;
        }

        .detach-button {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.25rem;
            border-radius: 25px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-input);
            color: var(--text-primary);
            font-size: 0.9rem;
            cursor: pointer;
            white-space: nowrap;
            transition: transform 0.35s ease-in-out,
                        opacity 0.35s ease-in-out,
                        width 0.35s ease-in-out,
                        padding 0.35s ease-in-out,
                        border-color 0.35s ease-in-out;
        }

        .bridge {
            height: 5px;
            width: 1.5rem; /* The length of the 'rope' */
            transition: width 0.35s ease-in-out,
                        opacity 0.3s ease-in-out,
                        border-radius 0.3s ease-in-out;
            cursor: pointer;
            border-radius: 0; /* Explicitly start as a straight line */
            opacity: 0.7;
        }
        .bridge:hover {
            opacity: 1;
        }

        .left-bridge {
            background: linear-gradient(to right, var(--accent-primary), var(--bg-input));
        }
        .right-bridge {
            background: linear-gradient(to left, var(--accent-primary), var(--bg-input));
        }

        /* Hide the button when detached */
        .bottom-bar-wrapper.left-detached .detach-button.left,
        .bottom-bar-wrapper.right-detached .detach-button.right {
            width: 0;
            padding-left: 0;
            padding-right: 0;
            opacity: 0;
            pointer-events: none;
            overflow: hidden;
            border-color: transparent !important; /* Ensure border color changes immediately on detach */
        }

        /* Curves for bridges when buttons are detached */
        .bottom-bar-wrapper.left-detached .left-bridge {
            border-top-left-radius: 4px; /* Smoother curve */
            border-bottom-left-radius: 4px; /* Smoother curve */
        }

        .bottom-bar-wrapper.right-detached .right-bridge {
            border-top-right-radius: 4px; /* Smoother curve */
            border-bottom-right-radius: 4px; /* Smoother curve */
        }


        /* --- Universal Components --- */
        .icon-button {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .icon-button:hover {
            background-color: var(--bg-input);
            color: var(--text-primary);
        }
        .user-account {
            background-color: #4285F4; /* Google Blue */
            color: white;
        }
        .user-account:hover {
            background-color: #5a95f5;
        }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // --- Sidebar Toggle & Analog Clock ---
            const sidebar = document.querySelector('.sidebar');
            const sidebarToggle = document.querySelector('.sidebar-toggle');
            const hourHand = document.getElementById('hour-hand');
            const minuteHand = document.getElementById('minute-hand');
            let analogClockInterval = null;

            function updateAnalogClock() {
                const now = new Date();
                let hours = now.getHours();
                let minutes = now.getMinutes();
                let seconds = now.getSeconds(); // For smoother minute hand movement

                // Rotation calculation
                // 360 degrees / 60 minutes/seconds = 6 degrees per minute/second
                // 360 degrees / 12 hours = 30 degrees per hour
                const minutesAngle = (minutes / 60) * 360 + (seconds / 60) * 6;
                const hoursAngle = ((hours % 12) / 12) * 360 + (minutes / 60) * 30;

                if (hourHand) { // Check if element exists
                    hourHand.setAttribute('transform', `rotate(${hoursAngle} 50 50)`);
                }
                if (minuteHand) { // Check if element exists
                    minuteHand.setAttribute('transform', `rotate(${minutesAngle} 50 50)`);
                }
            }

            sidebarToggle.addEventListener('click', () => {
                sidebar.classList.toggle('collapsed');

                if (sidebar.classList.contains('collapsed')) {
                    updateAnalogClock(); // Update immediately
                    if (analogClockInterval) clearInterval(analogClockInterval); // Clear existing interval
                    analogClockInterval = setInterval(updateAnalogClock, 1000); // Update every second
                } else {
                    if (analogClockInterval) {
                        clearInterval(analogClockInterval);
                        analogClockInterval = null;
                    }
                    // Optionally reset hands here, e.g., to 12:00
                    // if (hourHand) hourHand.setAttribute('transform', 'rotate(0 50 50)');
                    // if (minuteHand) minuteHand.setAttribute('transform', 'rotate(0 50 50)');
                }
            });

            // Initial check: if sidebar is collapsed on load, start the clock.
            if (sidebar.classList.contains('collapsed')) {
                updateAnalogClock();
                if (analogClockInterval) clearInterval(analogClockInterval); // Clear if already running
                analogClockInterval = setInterval(updateAnalogClock, 1000);
            }

            // --- Project Filtering & Pinning & Search ---
            const sidebarContent = document.querySelector('.sidebar-content');
            const searchInput = sidebarContent.querySelector('.search-bar input');
            const searchFilterButtons = sidebarContent.querySelectorAll('.search-filter-btn');

            const recentComponentsGrid = sidebarContent.querySelector('.component-grid'); // Assuming this is the correct selector
            const projectsSection = document.getElementById('projects-section');
            const pinnedProjectsSection = document.getElementById('pinned-projects-section');
            const pinnedItemsContainer = pinnedProjectsSection.querySelector('.pinned-items-container');

            let currentSearchFilter = 'all'; // Default search filter

            function updatePinnedSectionVisibility() {
                if (pinnedItemsContainer && pinnedProjectsSection && pinnedItemsContainer.children.length > 0) {
                    pinnedProjectsSection.style.display = 'block';
                } else if (pinnedProjectsSection) {
                    pinnedProjectsSection.style.display = 'none';
                }
            }

            function filterItems() {
                const searchTerm = searchInput.value.toLowerCase();

                // Filter "Recent Components"
                if (recentComponentsGrid) {
                    const componentItems = recentComponentsGrid.querySelectorAll('.component-item');
                    componentItems.forEach(item => {
                        const itemName = (item.dataset.name || '').toLowerCase();
                        const matchesTerm = itemName.includes(searchTerm);
                        const shouldShow = (currentSearchFilter === 'all' || currentSearchFilter === 'components') && matchesTerm;
                        item.style.display = shouldShow ? '' : 'none'; // Grid items, default display is fine
                    });
                }

                // Filter "Projects" (unpinned ones)
                if (projectsSection) {
                    const projectItems = projectsSection.querySelectorAll('.project-item[data-pinned="false"]');
                    projectItems.forEach(item => {
                        const itemName = (item.dataset.name || '').toLowerCase();
                        const matchesTerm = itemName.includes(searchTerm);
                        const shouldShow = (currentSearchFilter === 'all' || currentSearchFilter === 'projects') && matchesTerm;
                        item.style.display = shouldShow ? '' : 'none'; // List items, default display is fine
                    });
                }

                // Filter "Pinned Projects"
                if (pinnedItemsContainer) {
                    const pinnedProjectItems = pinnedItemsContainer.querySelectorAll('.project-item');
                    pinnedProjectItems.forEach(item => {
                        const itemName = (item.dataset.name || '').toLowerCase();
                        const matchesTerm = itemName.includes(searchTerm);
                        const shouldShow = (currentSearchFilter === 'all' || currentSearchFilter === 'projects') && matchesTerm;
                        item.style.display = shouldShow ? '' : 'none'; // List items, default display is fine
                    });
                }
                // Note: Visibility of the entire "Pinned" section is still handled by updatePinnedSectionVisibility
            }

            if (searchInput) {
                searchInput.addEventListener('input', filterItems);
            }

            searchFilterButtons.forEach(button => {
                button.addEventListener('click', (e) => {
                    searchFilterButtons.forEach(btn => btn.classList.remove('active-search-filter'));
                    e.target.classList.add('active-search-filter');
                    currentSearchFilter = e.target.dataset.searchFilter;
                    filterItems(); // Re-apply filters
                });
            });

            // Initialize project filtering and pinning logic only if elements exist
            if (projectsSection && pinnedProjectsSection && pinnedItemsContainer && sidebarContent) {
                const projectFilterButtons = projectsSection.querySelectorAll('.filter-btn');

                function sortProjects(filterType) {
                    // Only sort items currently within the main projectsSection and not pinned
                    const itemsToSort = Array.from(projectsSection.querySelectorAll('.project-item[data-pinned="false"]'));

                    itemsToSort.sort((a, b) => {
                        if (!a.dataset || !b.dataset) return 0;
                        const aName = a.dataset.name || '';
                        const bName = b.dataset.name || '';
                        const aTimestamp = a.dataset.timestamp || '';
                        const bTimestamp = b.dataset.timestamp || '';

                        if (filterType === 'newest') {
                            return bTimestamp.localeCompare(aTimestamp);
                        } else if (filterType === 'oldest') {
                            return aTimestamp.localeCompare(bTimestamp);
                        } else if (filterType === 'name') {
                            return aName.toLowerCase().localeCompare(bName.toLowerCase());
                        }
                        return 0;
                    });

                    itemsToSort.forEach(item => item.remove());
                    const projectFiltersDiv = projectsSection.querySelector('.project-filters');
                    itemsToSort.forEach(item => projectsSection.appendChild(item));
                }

                projectFilterButtons.forEach(button => {
                    button.addEventListener('click', (e) => {
                        projectFilterButtons.forEach(btn => btn.classList.remove('active-filter'));
                        e.target.classList.add('active-filter');
                        const filterType = e.target.dataset.filter;
                        sortProjects(filterType);
                    });
                });

                function togglePin(event) {
                    const pinButton = event.target.closest('.pin-btn');
                    if (!pinButton) return;

                    const projectItem = pinButton.closest('.project-item');
                    if (!projectItem || !projectItem.dataset) return;

                    const isPinned = projectItem.dataset.pinned === 'true';
                    const activeFilter = projectsSection.querySelector('.filter-btn.active-filter').dataset.filter;

                    if (isPinned) { // Unpinning: Item is in Pinned Section, move to Projects Section
                        projectItem.dataset.pinned = 'false';
                        pinButton.classList.remove('pinned');
                        projectsSection.appendChild(projectItem); // Add to main projects list
                        sortProjects(activeFilter); // Re-sort the Projects list
                    } else { // Pinning: Item is in Projects Section, move to Pinned Section
                        projectItem.dataset.pinned = 'true';
                        pinButton.classList.add('pinned');
                        pinnedItemsContainer.appendChild(projectItem); // Add to pinned container
                        // No need to re-sort projects list here, item is removed.
                        // However, if the item was part of a sorted list, its removal might affect visual order,
                        // but sortProjects is designed to only sort items *in* projectsSection.
                    }
                    updatePinnedSectionVisibility();
                }

                sidebarContent.addEventListener('click', function(event) {
                    // Check if the actual click target or its parent is a pin-btn
                    if (event.target.classList.contains('pin-btn') || event.target.closest('.pin-btn')) {
                         // Check if the project item is within projectsSection or pinnedItemsContainer before toggling
                        const projectItem = event.target.closest('.project-item');
                        if (projectItem && (projectsSection.contains(projectItem) || pinnedItemsContainer.contains(projectItem))) {
                            togglePin(event);
                        }
                    }
                });

                // Initial setup
                updatePinnedSectionVisibility();
                // Call sortProjects on load to ensure initial order based on default active filter ('newest')
                // This assumes project items are already in the projectsSection in the HTML initially.
                const initialFilter = projectsSection.querySelector('.filter-btn.active-filter');
                if (initialFilter) {
                    sortProjects(initialFilter.dataset.filter);
                }
            }

            // --- Interactive Card Effect ---
            const cards = document.querySelectorAll('.feature-card');

            cards.forEach(card => {
                card.addEventListener('mousemove', (e) => {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;

                    const rotateX = (y - centerY) / 20; // rotation factor
                    const rotateY = (centerX - x) / 20;

                    card.style.setProperty('--mouse-x', `${x}px`);
                    card.style.setProperty('--mouse-y', `${y}px`);
                    card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
                });

                card.addEventListener('mouseleave', () => {
                    card.style.transform = 'perspective(1000px) rotateX(0) rotateY(0)';
                });
            });

            // --- Bottom Bar "Bridge/Rope" Animation ---
            const bottomBarWrapper = document.querySelector('.bottom-bar-wrapper');
            const leftBridge = document.getElementById('left-bridge');
            const rightBridge = document.getElementById('right-bridge');

            // The bridge is now a toggle to hide/show the adjacent button
            leftBridge.addEventListener('click', () => {
                bottomBarWrapper.classList.toggle('left-detached');
            });

            rightBridge.addEventListener('click', () => {
                bottomBarWrapper.classList.toggle('right-detached');
            });
        });
    </script>
</body>
</html>
